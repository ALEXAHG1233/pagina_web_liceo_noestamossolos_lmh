<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de la psicóloga</title>
  {% include "_cabeza.html" %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/pop.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/pop_panel.css') }}">
</head>
<body class="panel-body">
  <div class="panel-container">
    <aside class="lista-chats">
      <p class="panel-quien">Sesión de {{ nombre_panel }}</p>
      <h2>Conversaciones</h2>
      <div class="filtro-riesgo" role="group" aria-label="Filtro de riesgo">
        <button type="button" data-nivel="todos" class="activo" aria-pressed="true">Todas <span>0</span></button>
        <button type="button" data-nivel="critico" class="nivel-critico" aria-pressed="false">Crítico <span>0</span></button>
        <button type="button" data-nivel="alto" class="nivel-alto" aria-pressed="false">Alto <span>0</span></button>
        <button type="button" data-nivel="medio" class="nivel-medio" aria-pressed="false">Medio <span>0</span></button>
        <button type="button" data-nivel="bajo" class="nivel-bajo" aria-pressed="false">Bajo <span>0</span></button>
      </div>
      <input type="search" id="buscar-correo" class="buscar-correo" placeholder="Buscar por correo" aria-label="Buscar por correo">
      <ul id="lista-tokens"></ul>
      <p id="lista-vacia" class="lista-vacia" hidden>No hay conversaciones con este filtro.</p>
    </aside>

    <main class="chat-container">
      <header class="chat-header">
        <div class="chat-header-top">
          <div>
            <h1 id="chat-titulo">Selecciona una conversación</h1>
            <p id="chat-riesgo" class="chat-riesgo" hidden></p>
          </div>
          {% include "_menu_panel.html" %}
        </div>
        <button id="btn-activar-sonido" class="btn-sonido">Activar alertas sonoras</button>
        <div id="selector-fondo" class="selector-fondo">
          <span>Fondo:</span>
        </div>
      </header>
      <div id="mensajes" class="mensajes"></div>
      <form id="form-mensaje" class="form-mensaje">
        <input type="text" id="input-mensaje" placeholder="Responder..." autocomplete="off" required>
        <button type="submit">Enviar</button>
      </form>
    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
  <script src="{{ url_for('static', filename='js/sonidos.js') }}"></script>
  <script src="{{ url_for('static', filename='js/common.js') }}"></script>
  <script src="{{ url_for('static', filename='js/psicologa.js') }}"></script>
  <script src="{{ url_for('static', filename='js/flip_fade.js') }}"></script>
  <script src="{{ url_for('static', filename='js/wave_grid.js') }}"></script>
</body>
</html>
