<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar con tu correo — No Estás Solo LMH</title>
  {% include "_cabeza.html" %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/pop.css') }}">
</head>
<body class="login-body">
  <div class="login-card">
    <h1>Antes de empezar a hablar</h1>
    <p class="login-nota">Escribe tu correo del liceo para empezar.</p>

    {% if error %}
      <p class="login-error">{{ error }}</p>
    {% endif %}

    <form method="POST" action="{{ url_for('entrar_correo') }}" class="login-form">
      <input type="hidden" name="csrf" value="{{ csrf_token() }}">
      <input type="hidden" name="siguiente" value="{{ siguiente }}">
      <label class="login-etiqueta" for="correo">Correo institucional</label>
      <input type="email" id="correo" name="correo" placeholder="usuario@{{ dominios[0] }}" autocomplete="email" required autofocus>
      <button type="submit">Empezar a hablar</button>
    </form>

    <p class="login-urgencia">¿Es una emergencia? Llama gratis al <a href="tel:150">150</a> (Teléfono de la Esperanza) o al <a href="tel:911">911</a>.</p>
    <a href="{{ url_for('index') }}" class="login-volver">← Volver al inicio</a>
  </div>
  <script src="{{ url_for('static', filename='js/common.js') }}"></script>
</body>
</html>
