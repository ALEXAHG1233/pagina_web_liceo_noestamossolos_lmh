<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video — Tu Espacio Seguro</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><path fill=%22%231f4d2c%22 d=%22M32 56s-20-12.6-27-24.4C-.2 21.6 4.6 10 15.4 8.4c6-.9 11.6 2 16.6 7.6 5-5.6 10.6-8.5 16.6-7.6C59.4 10 64.2 21.6 59 31.6 52 43.4 32 56 32 56Z%22/></svg>">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/diario.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/video.css') }}">
</head>
<body class="diario-body">

  <header class="diario-header">
    <a href="{{ url_for('index') }}" class="volver">← Volver</a>
    <h1>Video</h1>
  </header>

  <section class="pregunta-hoy video-seccion">
    {% if video_archivo %}
      <video class="video-reproductor" controls preload="metadata">
        <source src="{{ url_for('static', filename='videos/' + video_archivo) }}">
        Tu navegador no puede reproducir este video.
      </video>
    {% else %}
      <div class="video-vacio">
        <p>Todavía no se ha colocado ningún video aquí.</p>
        <p class="video-vacio-nota">Para agregarlo: coloca el archivo (.mp4, .webm o .ogg) dentro de la carpeta <code>static/videos/</code> del proyecto.</p>
      </div>
    {% endif %}
  </section>

  <script src="{{ url_for('static', filename='js/common.js') }}"></script>
</body>
</html>
