{# Menú de vidrio del panel de la psicóloga (estilo en css/pop_panel.css). #}
{% set pagina = request.endpoint %}
<nav class="menu" aria-label="Menú del panel">
  <a href="{{ url_for('psicologa') }}" {% if pagina == 'psicologa' %}class="active" aria-current="page"{% endif %}>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    <span>Chats</span>
  </a>
  <a href="{{ url_for('psicologa_contenido') }}" {% if pagina in ('psicologa_contenido', 'psicologa_articulo', 'psicologa_herramienta') %}class="active" aria-current="page"{% endif %}>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
    <span>Contenido</span>
  </a>
  <a href="{{ url_for('psicologa_estadisticas') }}" {% if pagina == 'psicologa_estadisticas' %}class="active" aria-current="page"{% endif %}>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><rect x="7" y="12" width="3" height="6" rx="1"/><rect x="12" y="8" width="3" height="10" rx="1"/><rect x="17" y="5" width="3" height="13" rx="1"/></svg>
    <span>Estadísticas</span>
  </a>
  <a href="{{ url_for('psicologa_logout') }}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
    <span>Salir</span>
  </a>
</nav>
