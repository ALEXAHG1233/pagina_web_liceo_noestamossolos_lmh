<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sin conexión — No Estás Solo LMH</title>
  {% include "_cabeza.html" %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    .sin-conexion { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center; }
    .sin-conexion img { width: 120px; height: auto; }
    .sin-conexion h1 { margin: 0; font-size: 28px; color: var(--amarillo); }
    .sin-conexion p { margin: 0; max-width: 420px; font-size: 17px; line-height: 1.55; color: var(--blanco-suave); }
    .sin-conexion .lineas { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 6px; }
    .sin-conexion .lineas a { padding: 12px 20px; border-radius: 999px; background: var(--amarillo); color: var(--verde-oscuro); font-weight: 800; text-decoration: none; }
    .sin-conexion button { margin-top: 8px; padding: 10px 20px; border-radius: 999px; border: 1px solid var(--dorado); background: transparent; color: var(--blanco); font: inherit; cursor: pointer; }
  </style>
</head>
<body>
  <main class="sin-conexion">
    <img src="{{ url_for('static', filename='images/logo_liceo.png') }}" alt="Logo del Liceo Militar de Honduras">
    <h1>Sin conexión a internet</h1>
    <p>Cuando vuelva la conexión podrás seguir usando la página. Si necesitas hablar con alguien ahora, estas líneas funcionan con una llamada normal:</p>
    <div class="lineas">
      <a href="tel:150">Llamar al 150 (Teléfono de la Esperanza)</a>
      <a href="tel:911">Llamar al 911</a>
    </div>
    <button type="button" onclick="location.reload()">Intentar de nuevo</button>
  </main>
</body>
</html>
